<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Collect Challenge</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Global font reset to force Montserrat Medium across everything */
        * {
            font-family: 'Montserrat', sans-serif !important;
        }
        
        body { margin: 0; overflow: hidden; background-color: #222; font-weight: 500; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Arcade HUD (hidden at start) */
        #score, #timer-display { position: absolute; color: white; font-size: 28px; font-weight: 900; z-index: 10; text-shadow: 2px 2px 4px black; display: none; }
        #score { left: 20px; top: 20px; }
        #timer-display { right: 20px; top: 20px; }
        
        /* ADVENTURE HUD (Always Visible during Adventure Gameplay) */
        #adventure-hud { position: absolute; left: 20px; top: 20px; display: none; z-index: 10; }
        .hud-row { display: flex; align-items: center; gap: 15px; }
        
        #open-inv-btn { background: #487eb0; color: white; border: 3px solid #fff; font-size: 14px; padding: 12px 20px; border-radius: 12px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: transform 0.2s, background 0.2s; font-weight: 700; }
        #open-inv-btn:hover { transform: scale(1.05); background: #00a8ff; }
        
        /* Pinned Money Badge during Gameplay */
        .pinned-money { background: #f1c40f; color: #2c3e50; font-weight: 700; font-size: 20px; padding: 10px 22px; border-radius: 50px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #fff; }

        /* INVENTORY SCREEN (50% Transparent) */
        #inventory-screen { position: fixed; top: 5vh; left: 5vw; width: 90vw; height: 90vh; background: rgba(0, 0, 0, 0.5); z-index: 1000; border-radius: 25px; border: 3px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); display: none; flex-direction: column; padding: 30px; box-sizing: border-box; color: white; }
        #inventory-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        
        /* Max rounded rectangle for coins inside inventory */
        .money-badge { background: #f1c40f; color: #2c3e50; font-weight: 700; font-size: 24px; padding: 10px 30px; border-radius: 50px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #close-inv-btn { background: #c23616; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 16px; }
        #close-inv-btn:hover { background: #ea2027; }

        /* Inventory grid (approx. 30 placeholders) */
        #inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; overflow-y: auto; flex-grow: 1; padding-right: 10px; }
        
        /* Max rounded item cards */
        .inv-item-card { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.15); border-radius: 50px; height: 90px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; position: relative; overflow: hidden; transition: background 0.2s, border-color 0.2s; }
        .inv-item-card:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(255,255,255,0.4); }
        .inv-item-info { display: flex; align-items: center; gap: 15px; font-size: 32px; font-weight: 700; }
        .inv-item-count { font-size: 22px; color: #f5f6fa; }
        
        /* Red trade button on hover */
        .sell-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%) scale(0); background: #c23616; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; box-shadow: 0 3px 8px rgba(0,0,0,0.3); }
        .inv-item-card:hover .sell-btn { transform: translateY(-50%) scale(1); }
        .sell-btn:hover { background: #ea2027; transform: translateY(-50%) scale(1.1) !important; }

        /* TRANSACTION MODAL (20% Transparent) */
        #sell-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.2); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .sell-box { background: #2f3640; border: 3px solid #487eb0; padding: 25px; border-radius: 20px; text-align: center; color: white; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .sell-box h3 { margin-top: 0; font-size: 20px; font-weight: 700; }
        .sell-input { width: 80%; padding: 10px; font-size: 18px; border-radius: 8px; border: 2px solid #487eb0; background: #222; color: white; text-align: center; font-weight: 700; margin-bottom: 5px; }
        .sell-input:focus { border-color: #00a8ff; outline: none; }
        .sell-hint { font-size: 13px; color: #dcdde1; font-style: italic; margin-bottom: 15px; display: block; }
        .sell-actions { display: flex; justify-content: center; gap: 10px; }

        #msg-container-top { position: fixed; top: 60px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10000; pointer-events: none; }
        #msg-container-bottom { position: fixed; bottom: 150px; left: 0; width: 100%; display: flex; flex-direction: column-reverse; align-items: center; z-index: 10000; pointer-events: none; }
        .admin-msg { font-size: 48px; font-weight: 900; text-align: center; text-shadow: 2px 2px 10px rgba(0,0,0,0.9); margin: 5px 0; width: 100%; }
        .txt-violet { color: #A020F0; }
        .rainbow-text { background: linear-gradient(to right, #ff9999, #ffcc99, #ffff99, #99ff99, #99ccff, #cc99ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; filter: drop-shadow(0px 0px 2px rgba(255,255,255,0.3)); }
        #hud-events { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: row-reverse; gap: 15px; z-index: 1000; }
        .event-card { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 12px; border: 2px solid #555; min-width: 80px; }
        .img-container { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; position: relative; font-size: 40px; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; position: absolute; z-index: 2; border-radius: 5px; }
        .event-timer { color: white; font-weight: 700; font-size: 20px; margin-top: 5px; }
        #discord-btn { position: absolute; bottom: 20px; left: 20px; z-index: 20; background: #5865F2; color: white; padding: 12px 18px; border-radius: 8px; text-decoration: none; font-weight: 700; }

        /* HOME SCREEN */
        #home-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, #2c3e50, #0f171e); z-index: 100; display: flex; flex-direction: column; box-sizing: border-box; }
        #rainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .home-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: center; }
        .home-header { position: absolute; top: 0; left: 0; width: 100%; height: 140px; display: flex; align-items: center; padding: 0 40px; box-sizing: border-box; }
        .logo-placeholder { font-size: 50px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 12px; border: 2px dashed rgba(255,255,255,0.3); position: absolute; left: 40px; }
        
        /* Main title forced to custom font family, rest is Montserrat */
        .main-title { 
            color: #ff3838; 
            font-family: 'Press Start 2P', cursive !important; 
            font-size: 32px; line-height: 1.5; text-transform: uppercase; text-shadow: 4px 4px 0px #000; margin: 0 auto; text-align: center; white-space: nowrap; 
        }

        /* ACCOUNT PANEL */
        #account-panel { background: rgba(0,0,0,0.6); border: 2px solid #487eb0; padding: 15px; border-radius: 15px; color: white; text-align: center; margin-bottom: 20px; min-width: 300px; }
        #account-select { padding: 8px; font-size: 16px; border-radius: 5px; background: #2f3640; color: white; border: 1px solid #487eb0; font-weight: 700; width: 100%; margin-bottom: 10px; }
        .acc-btn { background: #487eb0; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 700; font-size: 12px; margin: 2px; transition: background 0.2s; }
        .acc-btn:hover { background: #00a8ff; }
        .acc-btn.danger { background: #c23616; }
        .acc-btn.danger:hover { background: #ea2027; }

        .modes-container { display: flex; gap: 60px; margin-top: 10px; }
        
        /* Mode cards title font adjustments */
        .mode-card { 
            width: 320px; height: 220px; background: linear-gradient(135deg, #1e272e, #2f3640); border: 4px solid #487eb0; border-radius: 20px; color: white; display: flex; justify-content: center; align-items: center; 
            font-family: 'Press Start 2P', cursive !important; 
            font-size: 20px; text-align: center; cursor: pointer; position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; 
        }
        .mode-card:hover { transform: translateY(-10px) scale(1.03); border-color: #00a8ff; box-shadow: 0 15px 35px rgba(0, 168, 255, 0.4); }

        .bottom-action-btn { position: absolute; bottom: 40px; width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 15px rgba(0,0,0,0.4); transition: transform 0.2s ease, background-color 0.2s ease; cursor: pointer; border: none; text-decoration: none; }
        .bottom-action-btn:hover { transform: scale(1.1); }
        .bottom-action-btn img { width: 42px; height: 42px; object-fit: contain; }
        .discord-btn-left { left: 40px; background-color: #5865F2; }
        .discord-btn-left:hover { background-color: #4752c4; }
        .discord-btn-left img { border-radius: 50%; }
        .game-link-btn-right { right: 40px; background-color: #ffffff; }
        .game-link-btn-right:hover { background-color: #f0f0f0; }
        
        .inv-title-text {
            font-family: 'Press Start 2P', cursive !important;
            font-size: 18px; margin: 0; color: #487eb0;
        }
    </style>
</head>
<body>

    <div id="home-screen">
        <canvas id="rainCanvas"></canvas>

        <div class="home-content">
            <div class="home-header">
                <div class="logo-placeholder">🕹️</div> 
                <h1 class="main-title">Fast Collect Challenge</h1>
            </div>

            <div id="account-panel">
                <div style="font-weight: 700; margin-bottom: 8px; font-size: 18px;">👤 ADVENTURE ACCOUNT</div>
                <select id="account-select" onchange="switchAccount(this.value)"></select>
                <div>
                    <button class="acc-btn" onclick="createNewAccount()">+ New</button>
                    <button class="acc-btn" onclick="exportAccount()">📤 Export Key</button>
                    <button class="acc-btn" onclick="importAccount()">📥 Import Key</button>
                    <button class="acc-btn danger" onclick="deleteAccount()">🗑️ Delete</button>
                </div>
            </div>

            <div class="modes-container">
                <div class="mode-card" onclick="startAdventure()">
                    ADVENTURE<br>MODE
                </div>

                <div class="mode-card" onclick="startGame()">
                    ARCADE<br>MODE
                </div>
            </div>

            <a href="https://discord.gg/CP9hFvjDDC" target="_blank" class="bottom-action-btn discord-btn-left">
                <img src="https://static.vecteezy.com/system/resources/previews/006/892/625/non_2x/discord-logo-icon-editorial-free-vector.jpg" alt="Discord">
            </a>

            <a href="https://html-emojigames.github.io/play" target="_blank" class="bottom-action-btn game-link-btn-right">
                <img src="arrondi.png" alt="Play More Games">
            </a>
        </div>
    </div>

    <div id="score">Score: 0</div>
    <div id="timer-display">Timer: 60</div>
    
    <div id="adventure-hud">
        <div class="hud-row">
            <button id="open-inv-btn" onclick="toggleInventory(true)">🎒 Inventory</button>
            <div class="pinned-money">💰 <span id="pinned-money-counter">0</span></div>
        </div>
    </div>

    <div id="inventory-screen">
        <div id="inventory-header">
            <div class="money-badge">💰 <span id="inv-money-counter">0</span></div>
            <h2 class="inv-title-text">INVENTORY</h2>
            <button id="close-inv-btn" onclick="toggleInventory(false)">Close ✖</button>
        </div>
        <div id="inventory-grid"></div>
    </div>

    <div id="sell-modal">
        <div class="sell-box">
            <h3 id="sell-title">Sell Apples</h3>
            <input type="text" id="sell-quantity" class="sell-input" placeholder="Quantity">
            <span class="sell-hint">Type "Max" to sell all</span>
            <div class="sell-actions">
                <button class="acc-btn" onclick="confirmTransaction()">Confirm</button>
                <button class="acc-btn danger" onclick="closeSellModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="msg-container-top"></div>
    <div id="msg-container-bottom"></div>
    <div id="hud-events"></div>
    <a href="https://discord.gg/CP9hFvjDDC" target="_blank" id="discord-btn">Join Discord</a>
    <canvas id="gameCanvas"></canvas>

    <script>
        const ably = new Ably.Realtime('bZFMkw.u1oLTg:xhXyW5SeGGYAmDyoGjYDfkbodtDNkZcEMXw11__DDxM');
        const channel = ably.channels.get('admin-commands');
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        const rainCanvas = document.getElementById("rainCanvas");
        const rainCtx = rainCanvas.getContext("2d");

        function resize() { 
            canvas.width = window.innerWidth; canvas.height = window.innerHeight; 
            rainCanvas.width = window.innerWidth; rainCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize); 

        let timeLeft = 60, gameActive = false, currentLuck = 0.05, score = 0, scoreMult = 1;
        let currentGameMode = "arcade";
        let activeTimers = {}, player = { x: canvas.width / 2, y: canvas.height / 2 };
        let ball = { x: 100, y: 100, speed: 4, baseSpeed: 4, emoji: "🏐" }, greenAppleBoost = 3, apples = [];

        const LUCK_IMAGES = { 2: "https://static.wikia.nocookie.net/stealabr/images/e/ea/2xLuck.webp", 4: "https://static.wikia.nocookie.net/stealabr/images/f/f1/4xLuck.webp", 6: "https://static.wikia.nocookie.net/stealabr/images/9/9e/Clover5.webp", 8: "https://static.wikia.nocookie.net/stealabr/images/7/76/CloverStack.png", 10: "https://static.wikia.nocookie.net/stealabr/images/f/fe/10x.png" };

        // --- ACCOUNT & INVENTORY LOGIC ---
        let accounts = {
            "Default": { money: 0, redApples: 0, greenApples: 0 }
        };
        let currentAccountName = "Default";
        let activeSellType = null; 

        function loadAllAccounts() {
            const savedAccounts = localStorage.getItem("fastCollect_accounts");
            const savedActive = localStorage.getItem("fastCollect_activeAccount");
            if (savedAccounts) accounts = JSON.parse(savedAccounts);
            if (savedActive && accounts[savedActive]) {
                currentAccountName = savedActive;
            } else {
                currentAccountName = Object.keys(accounts)[0] || "Default";
            }
            renderAccountSelect();
            updateAdventureHUD();
        }

        function saveAllAccounts() {
            localStorage.setItem("fastCollect_accounts", JSON.stringify(accounts));
            localStorage.setItem("fastCollect_activeAccount", currentAccountName);
            updateAdventureHUD();
        }

        function renderAccountSelect() {
            const select = document.getElementById("account-select");
            select.innerHTML = "";
            Object.keys(accounts).forEach(name => {
                const opt = document.createElement("option");
                opt.value = name; opt.innerText = name;
                if(name === currentAccountName) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function createNewAccount() {
            const name = prompt("Enter new account name:");
            if(!name) return;
            const cleanName = name.trim();
            if(cleanName === "") return;
            if(accounts[cleanName]) { alert("This account name already exists!"); return; }
            accounts[cleanName] = { money: 0, redApples: 0, greenApples: 0 };
            currentAccountName = cleanName;
            saveAllAccounts();
            renderAccountSelect();
        }

        function switchAccount(name) {
            if(accounts[name]) { currentAccountName = name; saveAllAccounts(); }
        }

        function deleteAccount() {
            if(Object.keys(accounts).length <= 1) { alert("You must keep at least one active account!"); return; }
            if(confirm(`Are you sure you want to permanently delete account "${currentAccountName}"?`)) {
                delete accounts[currentAccountName];
                currentAccountName = Object.keys(accounts)[0];
                saveAllAccounts();
                renderAccountSelect();
            }
        }

        function exportAccount() {
            const dataStr = JSON.stringify({ name: currentAccountName, data: accounts[currentAccountName] });
            const token = btoa(unescape(encodeURIComponent(dataStr)));
            prompt("Copy your backup secure key:", token);
        }

        function importAccount() {
            const token = prompt("Paste your backup secure key here:");
            if(!token) return;
            try {
                const decodedStr = decodeURIComponent(escape(atob(token.trim())));
                const parsed = JSON.parse(decodedStr);
                if(parsed.name && parsed.data) {
                    if(accounts[parsed.name]) {
                        if(!confirm(`An account named "${parsed.name}" already exists here. Overwrite it?`)) return;
                    }
                    accounts[parsed.name] = parsed.data;
                    currentAccountName = parsed.name;
                    saveAllAccounts();
                    renderAccountSelect();
                    alert("Account imported successfully!");
                }
            } catch(e) { alert("Error reading key. Make sure you copied the full string."); }
        }

        // --- DYNAMIC INVENTORY HUB GENERATION ---
        function updateAdventureHUD() {
            const activeData = accounts[currentAccountName] || { money: 0, redApples: 0, greenApples: 0 };
            
            // Updates both inventory board counters and the permanently pinned gameplay counter
            document.getElementById("inv-money-counter").innerText = activeData.money;
            document.getElementById("pinned-money-counter").innerText = activeData.money;

            const grid = document.getElementById("inventory-grid");
            grid.innerHTML = "";

            const itemTypes = [
                { id: 'red', emoji: '🍎', label: 'Red Apple', count: activeData.redApples },
                { id: 'green', emoji: '🍏', label: 'Green Apple', count: activeData.greenApples }
            ];

            // Generating ~30 grid pills (including locked placeholders)
            for (let i = 0; i < 30; i++) {
                const card = document.createElement("div");
                card.className = "inv-item-card";

                if (i < itemTypes.length) {
                    const item = itemTypes[i];
                    card.innerHTML = `
                        <div class="inv-item-info">
                            <span>${item.emoji}</span>
                            <span class="inv-item-count">x${item.count}</span>
                        </div>
                        <button class="sell-btn" onclick="openSellModal('${item.id}')">💱</button>
                    `;
                } else {
                    card.style.opacity = "0.25";
                    card.style.borderStyle = "dashed";
                    card.innerHTML = `
                        <div class="inv-item-info" style="font-size: 18px; color: #aaa;">
                            <span>🔒</span>
                            <span>Empty</span>
                        </div>
                    `;
                }
                grid.appendChild(card);
            }
        }

        function toggleInventory(show) {
            const invScreen = document.getElementById("inventory-screen");
            if (show) {
                updateAdventureHUD();
                invScreen.style.display = "flex";
                gameActive = false; 
            } else {
                invScreen.style.display = "none";
                gameActive = true;
                update();
            }
        }

        function openSellModal(type) {
            activeSellType = type;
            const inputField = document.getElementById("sell-quantity");
            inputField.value = "";
            
            const title = document.getElementById("sell-title");
            title.innerText = type === 'red' ? "Sell Red Apples (+1💰)" : "Sell Green Apples (+3💰)";

            document.getElementById("sell-modal").style.display = "flex";
        }

        function closeSellModal() {
            document.getElementById("sell-modal").style.display = "none";
            activeSellType = null;
        }

        function confirmTransaction() {
            if (!activeSellType) return;

            const activeData = accounts[currentAccountName];
            if (!activeData) return;

            const inputVal = document.getElementById("sell-quantity").value.trim();
            let currentStock = activeSellType === 'red' ? activeData.redApples : activeData.greenApples;
            let unitPrice = activeSellType === 'red' ? 1 : 3;
            let amountToSell = 0;

            if (inputVal.toLowerCase() === 'max') {
                amountToSell = currentStock;
            } else {
                let parsedInt = parseInt(inputVal);
                if (isNaN(parsedInt) || parsedInt <= 0) {
                    alert("Please enter a valid amount or type 'Max'.");
                    return;
                }
                amountToSell = parsedInt > currentStock ? currentStock : parsedInt;
            }

            if (amountToSell <= 0) {
                alert("You don't have any apples of this kind to sell!");
                closeSellModal();
                return;
            }

            if (activeSellType === 'red') {
                activeData.redApples -= amountToSell;
            } else {
                activeData.greenApples -= amountToSell;
            }

            activeData.money += (amountToSell * unitPrice);
            
            saveAllAccounts();
            closeSellModal();
            updateAdventureHUD(); 
        }

        // --- BACKGROUND APPLE RAIN (HOME SCREEN) ---
        let rainApples = [];
        const maxRainApples = 40;

        function initRain() {
            rainApples = [];
            for (let i = 0; i < maxRainApples; i++) {
                rainApples.push({
                    x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight - window.innerHeight,
                    speed: 2 + Math.random() * 3, size: 24 + Math.random() * 16, emoji: Math.random() < 0.10 ? "🍏" : "🍎"
                });
            }
        }

        function updateRain() {
            if (gameActive) return;
            rainCtx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
            rainCtx.textAlign = "center";
            for (let i = 0; i < rainApples.length; i++) {
                let a = rainApples[i]; a.y += a.speed;
                if (a.y > rainCanvas.height + 40) { a.y = -40; a.x = Math.random() * rainCanvas.width; a.speed = 2 + Math.random() * 3; a.emoji = Math.random() < 0.10 ? "🍏" : "🍎"; }
                rainCtx.font = a.size + "px 'Montserrat'"; 
                rainCtx.fillText(a.emoji, a.x, a.y);
            }
            requestAnimationFrame(updateRain);
        }

        resize();
        initRain();
        updateRain();
        loadAllAccounts();

        // --- ARCADE GAME START ---
        function startGame() {
            currentGameMode = "arcade";
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("score").style.display = "block";
            document.getElementById("timer-display").style.display = "block";
            document.getElementById("adventure-hud").style.display = "none";
            
            score = 0; timeLeft = 60;
            document.getElementById("score").innerText = "Score: " + score;
            document.getElementById("timer-display").innerText = "Timer: " + timeLeft;

            gameActive = true;
            update(); 
            countdown();
            setInterval(() => { if(gameActive && currentGameMode === "arcade") spawnApple(false, 1); }, 1000);
        }

        // --- ADVENTURE GAME START ---
        function startAdventure() {
            currentGameMode = "adventure";
            document.getElementById("home-screen").style.display = "none";
            
            document.getElementById("score").style.display = "none";
            document.getElementById("timer-display").style.display = "none";
            document.getElementById("adventure-hud").style.display = "block";
            
            // Forces live alignment update on pinned budget widget
            updateAdventureHUD();

            gameActive = true;
            update(); 
            setInterval(() => { if(gameActive && currentGameMode === "adventure") spawnApple(false, 1); }, 1000);
        }

        // --- ABLY LISTENERS ---
        channel.subscribe((msg) => {
            const d = msg.data; if (!gameActive) return; 
            if (msg.name === 'luck') { currentLuck = d.val; showAdvancedMsg(`FelixRouge activated ${d.mult}x luck!`, 'bottom', getLuckStyle(d.mult)); startHudTimer('luck', LUCK_IMAGES[d.mult], d.time, "🍀", () => { currentLuck = 0.05; }); }
            if (msg.name === 'greentime') { let oldL = currentLuck; currentLuck = 1.0; showAdvancedMsg(`FelixRouge activated <span class="txt-violet">Green time</span>!`, 'bottom', getGTStyle(d.time)); startHudTimer('gt', "https://static.vecteezy.com/system/resources/previews/016/733/263/non_2x/cute-illustration-of-a-green-apple-in-cartoon-style-on-isolated-background-vector.jpg", d.time, "🍏", () => { currentLuck = oldL; }); }
            if (msg.name === 'doublepoints') { scoreMult = 2; showAdvancedMsg(`FelixRouge activated <span class="txt-violet">Double Points</span>!`, 'bottom', {isRainbow: true}); startHudTimer('dp', "https://fridg-front.s3.amazonaws.com/media/CACHE/images/products/lot-de-2-pommes-fuji_fEa1aJa/8e7b583a2aa9503e79230ddfaf062316.jpg", d.time, "🍎", () => { scoreMult = 1; }); }
            if (msg.name === 'addtime' && currentGameMode === "arcade") { timeLeft += d.seconds; showAdvancedMsg(`FelixRouge added ${d.seconds}s to your <span class="txt-violet">timer</span>!`, 'bottom', getTStyle(d.seconds)); }
            if (msg.name === 'spawn') { spawnApple(true, d.count); showAdvancedMsg(`FelixRouge spawned ${d.count} Green Apples!`, 'bottom', getSStyle(d.count)); }
            if (msg.name === 'ballSpeed') { ball.baseSpeed = 4 * d.mult; ball.speed = ball.baseSpeed; showAdvancedMsg(`FelixRouge set ball speed to x${d.mult}`, 'bottom', d.mult >= 2 ? {color:'black'} : {color:'white'}); }
            if (msg.name === 'appleSpeed') { greenAppleBoost = d.mult; showAdvancedMsg(`FelixRouge set apple boost to x${d.mult}`, 'bottom', d.mult >= 5 ? {isRainbow: true} : {color:'#32CD32'}); }
            if (msg.name === 'announce') showAdvancedMsg(d.text, 'top', {color: 'white'});
            if (msg.name === 'clearLuck') { currentLuck = 0.05; scoreMult = 1; Object.keys(activeTimers).forEach(id => { clearInterval(activeTimers[id].interval); let c = document.getElementById('event-'+id); if(c) c.remove(); delete activeTimers[id]; }); }
            if (msg.name === 'reset') location.reload();
        });

        function getLuckStyle(m) { if(m==2) return {color:'#32CD32'}; if(m==4) return {color:'#DAA520'}; if(m==6) return {color:'#DA70D6'}; if(m==8) return {isRainbow:true}; if(m==10) return {color:'black'}; return {color:'white'}; }
        function getGTStyle(s) { if(s==5) return {color:'#32CD32'}; if(s==10) return {color:'#DAA520'}; if(s==15) return {color:'#DA70D6'}; if(s==20) return {isRainbow:true}; if(s==30) return {color:'black'}; return {color:'white'}; }
        function getTStyle(s) { if(s==10) return {color:'#32CD32'}; if(s==15) return {color:'#DAA520'}; if(s==20) return {color:'#DA70D6'}; if(s>=30) return {isRainbow:true}; return {color:'white'}; }
        function getSStyle(c) { if(c==3) return {color:'#DAA520'}; if(c==5) return {color:'#DA70D6'}; if(c==7) return {isRainbow:true}; if(c>=10) return {color:'black'}; return {color:'white'}; }

        function showAdvancedMsg(html, pos, style) {
            const container = document.getElementById(pos === 'top' ? 'msg-container-top' : 'msg-container-bottom');
            const div = document.createElement('div'); div.className = 'admin-msg';
            if(style.isRainbow) div.innerHTML = `<span class="rainbow-text">${html}</span>`;
            else { div.style.color = style.color; div.innerHTML = html; if(style.color === 'black') div.style.textShadow = "0px 0px 8px rgba(255,255,255,0.7)"; }
            container.appendChild(div); setTimeout(() => div.remove(), 5000);
        }

        function startHudTimer(id, url, dur, fallbackEmoji, onE) {
            let container = document.getElementById('hud-events');
            if (activeTimers[id]) { activeTimers[id].remaining += dur; return; }
            let card = document.createElement('div'); card.className = 'event-card'; card.id = 'event-' + id;
            card.innerHTML = `<div class="img-container"><span>${fallbackEmoji}</span><img src="${url}" onerror="this.style.display='none'"></div><div class="event-timer" id="timer-${id}">${dur}s</div>`;
            container.appendChild(card);
            activeTimers[id] = { remaining: dur, interval: setInterval(() => {
                activeTimers[id].remaining--;
                if (activeTimers[id].remaining <= 0 || !gameActive) { clearInterval(activeTimers[id].interval); card.remove(); delete activeTimers[id]; if(onE) onE(); }
                else { let t = document.getElementById('timer-' + id); if(t) t.innerText = activeTimers[id].remaining + "s"; }
            }, 1000)};
        }

        function spawnApple(fG, c) {
            if(!gameActive) return;
            for(let i=0; i<c; i++) {
                let isOp = fG || Math.random() < currentLuck;
                apples.push({ x: Math.random() * (canvas.width - 30), y: Math.random() * (canvas.height - 30), size: isOp ? 22 : 34, emoji: isOp ? "🍏" : "🍎", isOp: isOp });
            }
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let dx = player.x - ball.x, dy = player.y - ball.y, dist = Math.sqrt(dx*dx+dy*dy);
            if(dist > 35) { ball.x += (dx/dist)*ball.speed; ball.y += (dy/dist)*ball.speed; }
            
            // Forced Montserrat for dynamically rendered text layers on canvas context
            ctx.font = "bold 40px Montserrat"; ctx.textAlign = "center"; 
            ctx.fillText("🕹", player.x, player.y); ctx.fillText(ball.emoji, ball.x, ball.y);
            
            apples = apples.filter(a => {
                if(Math.sqrt((ball.x-a.x)**2 + (ball.y-a.y)**2) < a.size) {
                    if (currentGameMode === "arcade") {
                        score += (a.isOp ? 3 : 1) * scoreMult; 
                        document.getElementById("score").innerText = "Score: " + score;
                    } else if(currentGameMode === "adventure") {
                        let activeData = accounts[currentAccountName];
                        if(activeData) {
                            if(a.isOp) activeData.greenApples += 1;
                            else activeData.redApples += 1;
                            saveAllAccounts();
                        }
                    }
                    if(a.isOp) { ball.speed = ball.baseSpeed * greenAppleBoost; setTimeout(() => ball.speed = ball.baseSpeed, 3000); }
                    return false;
                }
                ctx.font = a.size + "px Montserrat"; ctx.fillText(a.emoji, a.x, a.y); return true;
            });
            requestAnimationFrame(update);
        }

        function countdown() {
            if(!gameActive || currentGameMode !== "arcade") return;
            if (timeLeft > 0) { timeLeft--; document.getElementById("timer-display").innerText = "Timer: " + timeLeft; setTimeout(countdown, 1000); }
            else { 
                gameActive = false; 
                setTimeout(() => { 
                    if(confirm("Game Over! Restart?")) { location.reload(); } 
                    else {
                        document.getElementById("home-screen").style.display = "flex";
                        document.getElementById("score").style.display = "none";
                        document.getElementById("timer-display").style.display = "none";
                        initRain(); updateRain();
                    }
                }, 100); 
            }
        }

        window.addEventListener("mousemove", (e) => { player.x = e.clientX; player.y = e.clientY; });
    </script>
</body>
